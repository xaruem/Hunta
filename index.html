<!DOCTYPE html>

<body>

<header>

<section class="hero">

      <div class="hero-cta">

        <a href="#" class="btn btn-outline" data-i18n="hero.cta2"></a>
      </div>
    </div>
    <div class="hero-visual">
      <div class="scope"></div>
      <div class="frame">
        <video autoplay muted loop playsinline>
          <source src="1.mp4" type="video/mp4">
        </video>
        <div class="video-caption">
          <h3 data-i18n="hero.videoCaption"></h3>
          <p data-i18n="hero.videoInfo"></p>
        </div>
      </div>
      <div class="tag"><b>2 498</b><span data-i18n="hero.tagLabel"></span></div>
    </div>
  </div>
</section>

<section class="stats dark-zone">

      <div class="fcard profile-card" data-profile="p5" data-tg="https://t.me/najimovdilshodbek">
        <img src="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%20400%20420%27%3E%3Crect%20width%3D%27400%27%20height%3D%27420%27%20fill%3D%27%2314120F%27/%3E%3Ctext%20x%3D%27200%27%20y%3D%27255%27%20font-family%3D%27Arial%2C%20Helvetica%2C%20sans-serif%27%20font-size%3D%27170%27%20font-weight%3D%27700%27%20fill%3D%27%23C9962E%27%20text-anchor%3D%27middle%27%3E%D0%94%3C/text%3E%3C/svg%3E" alt="">
        <div class="overlay">
          <div class="role" data-i18n="profiles.p5.role"></div>
          <div class="who" data-i18n="profiles.p5.name"></div>
        </div>

      <div class="fcard cta-card">

</section>

<section class="section dark-zone">
  <div class="wrap">
    <div class="steps-block">
      <div class="kicker"><h3 data-i18n="steps.shopTitle"></h3><span data-i18n="steps.shopTag"></span></div>
      <div class="steps-grid">
        <div class="step"><div class="idx">01</div><h4 data-i18n="steps.shop1t"></h4><p data-i18n="steps.shop1p"></p></div>
        <div class="step"><div class="idx">02</div><h4 data-i18n="steps.shop2t"></h4><p data-i18n="steps.shop2p"></p></div>
        <div class="step"><div class="idx">03</div><h4 data-i18n="steps.shop3t"></h4><p data-i18n="steps.shop3p"></p></div>
      </div>
    </div>
    <div class="steps-block">
      <div class="kicker"><h3 data-i18n="steps.exTitle"></h3><span data-i18n="steps.exTag"></span></div>
      <div class="steps-grid">
        <div class="step"><div class="idx">01</div><h4 data-i18n="steps.ex1t"></h4><p data-i18n="steps.ex1p"></p></div>
        <div class="step"><div class="idx">02</div><h4 data-i18n="steps.ex2t"></h4><p data-i18n="steps.ex2p"></p></div>
        <div class="step"><div class="idx">03</div><h4 data-i18n="steps.ex3t"></h4><p data-i18n="steps.ex3p"></p></div>

      <div class="testi"><img src="https://images.pexels.com/photos/2379005/pexels-photo-2379005.jpeg?auto=compress&cs=tinysrgb&w=300" alt=""><div class="body"><p data-i18n="testi.q2"></p><div class="who" data-i18n="testi.w2"></div></div></div>
      <div class="testi"><img src="https://images.pexels.com/photos/2381069/pexels-photo-2381069.jpeg?auto=compress&cs=tinysrgb&w=300" alt=""><div class="body"><p data-i18n="testi.q3"></p><div class="who" data-i18n="testi.w3"></div></div></div>
      <div class="testi"><img src="https://images.pexels.com/photos/1130626/pexels-photo-1130626.jpeg?auto=compress&cs=tinysrgb&w=300" alt=""><div class="body"><p data-i18n="testi.q4"></p><div class="who" data-i18n="testi.w4"></div></div></div>

<section class="section dark-zone">

      <div class="faq-item"><button class="faq-q"><span data-i18n="faq.q4"></span><span class="plus">+</span></button><div class="faq-a"><p data-i18n="faq.a4"></p></div></div>
      <div class="faq-item"><button class="faq-q"><span data-i18n="faq.q5"></span><span class="plus">+</span></button><div class="faq-a"><p data-i18n="faq.a5"></p></div></div>

        <a href="https://t.me/vvebstyle" target="_blank">TG: @vvebstyle</a>

    <div class="footer-bottom">
      <span class="mono" data-i18n="footer.copy"></span>

    </div>

<!-- Profile modal -->
<div class="profile-modal-overlay" id="profileModalOverlay">
  <div class="profile-modal">
    <button class="modal-close" id="modalClose" aria-label="Close">&times;</button>
    <div class="modal-photo"><img id="modalPhoto" src="" alt=""></div>
    <div class="modal-info">
      <h3 id="modalName"></h3>
      <div class="modal-role" id="modalRole"></div>
      <p class="modal-bio" id="modalBio"></p>
      <a href="#" class="btn btn-primary" id="modalWriteBtn" target="_blank" data-i18n="contact.write"></a>
    </div>
  </div>
</div>

<!-- Auth modal: вход / регистрация через номер телефона + код из Telegram-бота -->
<div class="auth-modal-overlay" id="authModalOverlay">
  <div class="auth-modal">
    <button class="modal-close" id="authModalClose" aria-label="Close">&times;</button>

    <div class="auth-tabs">
      <button class="auth-tab" data-auth-tab="login" data-i18n="auth.tabLogin"></button>
      <button class="auth-tab" data-auth-tab="register" data-i18n="auth.tabRegister"></button>
    </div>

    <!-- Шаг 1: телефон -->
    <div class="auth-step" data-auth-step="phone">
      <h3 id="authPhoneTitle"></h3>
      <p class="auth-hint" data-i18n="auth.phoneHint"></p>
      <div class="auth-field">
        <span class="auth-prefix">+998</span>
        <input type="tel" id="authPhoneInput" inputmode="numeric" maxlength="9" placeholder="90 123 45 67" autocomplete="off">
      </div>
      <p class="auth-error" id="authPhoneError"></p>
      <button class="btn btn-primary auth-submit" id="authSendCodeBtn" data-i18n="auth.getCode"></button>
    </div>

    <!-- Шаг 2: код из бота -->
    <div class="auth-step" data-auth-step="code" hidden>
      <h3 data-i18n="auth.codeTitle"></h3>
      <p class="auth-hint">
        <span data-i18n="auth.codeHint"></span> <b id="authPhoneDisplay"></b><br>
        <a href="#" id="authChangePhone" data-i18n="auth.changeNumber"></a>
      </p>
      <div class="auth-field auth-code-field">
        <input type="text" id="authCodeInput" inputmode="numeric" maxlength="5" placeholder="• • • • •" autocomplete="off">
      </div>
      <p class="auth-error" id="authCodeError"></p>
      <button class="btn btn-primary auth-submit" id="authVerifyBtn" data-i18n="auth.verify"></button>
      <button class="auth-resend" id="authResendBtn" data-i18n="auth.resend"></button>
    </div>

    <!-- Шаг 3: успех -->
    <div class="auth-step" data-auth-step="success" hidden>
      <div class="auth-success-icon">✓</div>
      <h3 id="authSuccessTitle"></h3>
      <p class="auth-hint" data-i18n="auth.successHint"></p>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
