<!DOCTYPE html>
<html lang="ru" data-theme="light" data-lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hunta — фриланс-маркетплейс</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <div class="header-inner">
    <a href="#" class="logo"><span class="dot"></span>HUNTA</a>
    <nav class="main-nav">
      <a data-i18n="nav.design" href="#"></a>
      <a data-i18n="nav.dev" href="#"></a>
      <a data-i18n="nav.texts" href="#"></a>
      <a data-i18n="nav.seo" href="#"></a>
      <a data-i18n="nav.smm" href="#"></a>
      <a data-i18n="nav.media" href="#"></a>
    </nav>
    <div class="header-actions">
      <div class="switcher" id="langSwitcher">
        <button data-lang-btn="ru">RU</button>
        <button data-lang-btn="en">EN</button>
        <button data-lang-btn="uz">UZ</button>
      </div>
      <button class="theme-toggle" id="themeToggle" aria-label="Переключить тему">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"/></svg>
      </button>
      <a href="#" class="link-quiet" data-i18n="header.login"></a>
      <a href="#" class="btn btn-primary" data-i18n="header.register"></a>
    </div>
  </div>
  <div class="ribbon">
    <div class="ribbon-track">
      <span data-i18n="ribbon.r1"></span><span data-i18n="ribbon.r2"></span><span data-i18n="ribbon.r3"></span>
      <span data-i18n="ribbon.r1"></span><span data-i18n="ribbon.r2"></span><span data-i18n="ribbon.r3"></span>
    </div>
  </div>
</header>

<section class="hero">
  <div class="wrap hero-grid">
    <div>
      <div class="eyebrow" data-i18n="hero.eyebrow"></div>
      <h1 data-i18n-html="hero.h1"></h1>
      <p class="lead" data-i18n="hero.lead"></p>
      <div class="hero-cta">
        <a href="#" class="btn btn-primary" data-i18n="hero.cta1"></a>
        <a href="#" class="btn btn-outline" data-i18n="hero.cta2"></a>
      </div>
    </div>
    <div class="hero-visual">
      <div class="scope"></div>
      <div class="frame">
        <video autoplay muted loop playsinline>
          <source src="1.mp4" type="video/mp4">
        </video>
      </div>
      <div class="tag"><b>2 498</b><span data-i18n="hero.tagLabel"></span></div>
    </div>
  </div>
</section>

<section class="stats dark-zone">
  <div class="wrap stats-grid">
    <div><div class="num">1×/мин</div><div class="label" data-i18n="stats.l1"></div></div>
    <div><div class="num">4 000 000 summ</div><div class="label" data-i18n="stats.l2"></div></div>
    <div><div class="num">2 498</div><div class="label" data-i18n="stats.l3"></div></div>
  </div>
</section>

<section class="section">
  <div class="wrap">
    <div class="section-head">
      <div class="eyebrow" data-i18n="community.eyebrow"></div>
      <h2 data-i18n="community.h2"></h2>
      <p data-i18n="community.p"></p>
    </div>
    <div class="grid-cards">

      <!-- Real profile 1 -->
      <div class="fcard profile-card" data-profile="p1" data-tg="https://t.me/vvebstyle">
        <img src="1.png" alt="">
        <div class="overlay">
          <div class="role" data-i18n="profiles.p1.role"></div>
          <div class="who" data-i18n="profiles.p1.name"></div>
        </div>
        <button class="write-btn" data-i18n="contact.write"></button>
      </div>

      <!-- Real profile 2 -->
      <div class="fcard profile-card" data-profile="p2" data-tg="https://t.me/vvebstyle">
        <img src="2.png" alt="">
        <div class="overlay">
          <div class="role" data-i18n="profiles.p2.role"></div>
          <div class="who" data-i18n="profiles.p2.name"></div>
        </div>
        <button class="write-btn" data-i18n="contact.write"></button>
      </div>

      <!-- Real profile 3 -->
      <div class="fcard profile-card" data-profile="p3" data-tg="https://t.me/vvebstyle">
        <img src="3.png" alt="">
        <div class="overlay">
          <div class="role" data-i18n="profiles.p3.role"></div>
          <div class="who" data-i18n="profiles.p3.name"></div>
        </div>
        <button class="write-btn" data-i18n="contact.write"></button>
      </div>

      <!-- Placeholder cards (name only, no real profile behind them yet) -->
      <div class="fcard"><img src="https://images.pexels.com/photos/5905445/pexels-photo-5905445.jpeg?auto=compress&cs=tinysrgb&w=600" alt=""><div class="overlay"><div class="role" data-i18n="roles.marketer"></div><div class="who">Hunta</div></div></div>
      <div class="fcard"><img src="https://images.pexels.com/photos/4050315/pexels-photo-4050315.jpeg?auto=compress&cs=tinysrgb&w=600" alt=""><div class="overlay"><div class="role" data-i18n="roles.editor"></div><div class="who">Hunta</div></div></div>
      <div class="fcard"><img src="https://images.pexels.com/photos/1181244/pexels-photo-1181244.jpeg?auto=compress&cs=tinysrgb&w=600" alt=""><div class="overlay"><div class="role" data-i18n="roles.smm"></div><div class="who">Hunta</div></div></div>
      <div class="fcard"><img src="https://images.pexels.com/photos/3861972/pexels-photo-3861972.jpeg?auto=compress&cs=tinysrgb&w=600" alt=""><div class="overlay"><div class="role" data-i18n="roles.mobilographer"></div><div class="who">Hunta</div></div></div>

      <div class="fcard cta-card">
        <h3 data-i18n="community.ctaTitle"></h3>
        <a href="#" class="btn btn-primary" data-i18n="hero.cta1"></a>
      </div>
    </div>
  </div>
</section>

<section class="section dark-zone">
  <div class="wrap">
    <div class="steps-block">
      <div class="kicker"><h3 data-i18n="steps.shopTitle"></h3><span data-i18n="steps.shopTag"></span></div>
      <div class="steps-grid">
        <div class="step"><div class="idx">01</div><h4 data-i18n="steps.shop1t"></h4><p data-i18n="steps.shop1p"></p></div>
        <div class="step"><div class="idx">02</div><h4 data-i18n="steps.shop2t"></h4><p data-i18n="steps.shop2p"></p></div>
        <div class="step"><div class="idx">03</div><h4 data-i18n="steps.shop3t"></h4><p data-i18n="steps.shop3p"></p></div>
      </div>
    </div>
    <div class="steps-block">
      <div class="kicker"><h3 data-i18n="steps.exTitle"></h3><span data-i18n="steps.exTag"></span></div>
      <div class="steps-grid">
        <div class="step"><div class="idx">01</div><h4 data-i18n="steps.ex1t"></h4><p data-i18n="steps.ex1p"></p></div>
        <div class="step"><div class="idx">02</div><h4 data-i18n="steps.ex2t"></h4><p data-i18n="steps.ex2p"></p></div>
        <div class="step"><div class="idx">03</div><h4 data-i18n="steps.ex3t"></h4><p data-i18n="steps.ex3p"></p></div>
      </div>
    </div>
  </div>
</section>

<section class="section">
  <div class="wrap">
    <div class="section-head">
      <div class="eyebrow" data-i18n="testi.eyebrow"></div>
      <h2 data-i18n="testi.h2"></h2>
    </div>
    <div class="testi-grid">
      <div class="testi"><img src="https://images.pexels.com/photos/3184339/pexels-photo-3184339.jpeg?auto=compress&cs=tinysrgb&w=300" alt=""><div class="body"><p data-i18n="testi.q1"></p><div class="who" data-i18n="testi.w1"></div></div></div>
      <div class="testi"><img src="https://images.pexels.com/photos/2379005/pexels-photo-2379005.jpeg?auto=compress&cs=tinysrgb&w=300" alt=""><div class="body"><p data-i18n="testi.q2"></p><div class="who" data-i18n="testi.w2"></div></div></div>
      <div class="testi"><img src="https://images.pexels.com/photos/2381069/pexels-photo-2381069.jpeg?auto=compress&cs=tinysrgb&w=300" alt=""><div class="body"><p data-i18n="testi.q3"></p><div class="who" data-i18n="testi.w3"></div></div></div>
      <div class="testi"><img src="https://images.pexels.com/photos/1130626/pexels-photo-1130626.jpeg?auto=compress&cs=tinysrgb&w=300" alt=""><div class="body"><p data-i18n="testi.q4"></p><div class="who" data-i18n="testi.w4"></div></div></div>
    </div>
  </div>
</section>

<section class="section dark-zone">
  <div class="wrap">
    <div class="section-head">
      <div class="eyebrow" data-i18n="faq.eyebrow"></div>
      <h2 data-i18n="faq.h2"></h2>
    </div>
    <div class="faq">
      <div class="faq-item"><button class="faq-q"><span data-i18n="faq.q1"></span><span class="plus">+</span></button><div class="faq-a"><p data-i18n="faq.a1"></p></div></div>
      <div class="faq-item"><button class="faq-q"><span data-i18n="faq.q2"></span><span class="plus">+</span></button><div class="faq-a"><p data-i18n="faq.a2"></p></div></div>
      <div class="faq-item"><button class="faq-q"><span data-i18n="faq.q3"></span><span class="plus">+</span></button><div class="faq-a"><p data-i18n="faq.a3"></p></div></div>
      <div class="faq-item"><button class="faq-q"><span data-i18n="faq.q4"></span><span class="plus">+</span></button><div class="faq-a"><p data-i18n="faq.a4"></p></div></div>
      <div class="faq-item"><button class="faq-q"><span data-i18n="faq.q5"></span><span class="plus">+</span></button><div class="faq-a"><p data-i18n="faq.a5"></p></div></div>
    </div>
  </div>
</section>

<section class="section final-cta">
  <div class="wrap">
    <h2 data-i18n="finalCta.h2"></h2>
    <a href="#" class="btn btn-primary" data-i18n="header.register"></a>
  </div>
</section>

<footer class="dark-zone">
  <div class="wrap">
    <div class="footer-top">
      <div>
        <a href="#" class="logo"><span class="dot"></span>HUNTA</a>
        <p data-i18n="footer.tagline"></p>
      </div>
      <div class="footer-col">
        <h5 data-i18n="footer.h1"></h5>
        <a data-i18n="footer.l1"></a><a data-i18n="footer.l2"></a><a data-i18n="footer.l3"></a>
      </div>
      <div class="footer-col">
        <h5 data-i18n="footer.h2"></h5>
        <a data-i18n="footer.l4"></a><a data-i18n="footer.l5"></a><a data-i18n="footer.l6"></a>
      </div>
      <div class="footer-col">
        <h5 data-i18n="footer.h3"></h5>
        <a data-i18n="footer.l7"></a><a data-i18n="footer.l8"></a><a data-i18n="footer.l9"></a>
      </div>
      <div class="footer-col">
        <h5 data-i18n="footer.h4"></h5>
        <a href="https://t.me/vvebstyle" target="_blank">TG: @vvebstyle</a>
        <a href="https://t.me/webflow_siteuz" target="_blank" data-i18n="footer.channel"></a>
      </div>
    </div>
    <div class="footer-bottom">
      <span class="mono" data-i18n="footer.copy"></span>
      <div class="social"><a href="https://t.me/vvebstyle" target="_blank">TG</a><a href="#">VK</a></div>
    </div>
  </div>
</footer>

<!-- Profile modal -->
<div class="profile-modal-overlay" id="profileModalOverlay">
  <div class="profile-modal">
    <button class="modal-close" id="modalClose" aria-label="Close">&times;</button>
    <div class="modal-photo"><img id="modalPhoto" src="" alt=""></div>
    <div class="modal-info">
      <h3 id="modalName"></h3>
      <div class="modal-role" id="modalRole"></div>
      <p class="modal-bio" id="modalBio"></p>
      <a href="#" class="btn btn-primary" id="modalWriteBtn" target="_blank" data-i18n="contact.write"></a>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
